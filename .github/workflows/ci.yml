name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:skip-controls
      - run: node --test scripts/tests/*.test.mjs

  playback:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg mpv
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: docker build -t animetvcut-mediaflow:2.4.9-atc23-test -f docker/mediaflow/Dockerfile .
      - run: pnpm test:mediaflow
      - run: pnpm test:stremio
      - run: pnpm test:long-cuts
      - run: pnpm test:skip

  deploy:
    needs: [checks, playback]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy the revision that passed CI
        run: node scripts/deploy.mjs
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APPLICATION_UUID: ${{ secrets.COOLIFY_APPLICATION_UUID }}
      - name: Verify public health and addon manifest
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 https://atc.kanji.moe/health | jq -e '.status == "ok"'
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 https://atc.kanji.moe/v2/manifest.json | jq -e '.id == "org.animetvcut.addon.v2"'
