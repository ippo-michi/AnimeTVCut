services:
  fixture-origin:
    image: node:22-alpine
    working_dir: /workspace
    command: ["node", "scripts/fixture-origin.mjs"]
    environment:
      FIXTURE_MEDIA_ROOT: /workspace/fixtures/media
      FIXTURE_TEST_TOKEN: stremio-upstream-secret
    volumes:
      - ..:/workspace:ro
    ports:
      - "127.0.0.1:18090:8090"
    networks: [phase5-test]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 2s
      timeout: 2s
      retries: 20

  fixture-stremio:
    image: node:22-alpine
    working_dir: /workspace
    command: ["node", "scripts/fixture-stremio-addon.mjs"]
    environment:
      FIXTURE_MEDIA_ORIGIN: http://fixture-origin:8090
      FIXTURE_MEDIA_TOKEN: stremio-upstream-secret
      FIXTURE_SUBTITLE_ORIGIN: http://127.0.0.1:19093
    volumes:
      - ..:/workspace:ro
    ports:
      - "127.0.0.1:18989:8091"
    networks: [phase5-test]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8091/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 2s
      timeout: 2s
      retries: 20

  fixture-subtitles:
    image: node:22-alpine
    working_dir: /workspace
    command: ["node", "scripts/fixture-subtitle-origin.mjs"]
    volumes: ["..:/workspace:ro"]
    ports: ["127.0.0.1:19093:8093"]
    networks: [phase5-test]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8093/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 2s
      timeout: 2s
      retries: 20

  fixture-metadata:
    image: node:22-alpine
    working_dir: /workspace
    command: ["node", "scripts/fixture-metadata-addon.mjs"]
    volumes:
      - ..:/workspace:ro
    ports:
      - "127.0.0.1:19092:8092"
    networks: [phase5-test]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8092/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 2s
      timeout: 2s
      retries: 20

  mediaflow:
    image: mhdzumair/mediaflow-proxy:v2.4.9
    environment:
      API_PASSWORD: phase5-integration-password
      ENABLE_TRANSCODE: "true"
    ports:
      - "127.0.0.1:18888:8888"
    networks: [phase5-test]
    depends_on:
      fixture-origin:
        condition: service_healthy
      fixture-stremio:
        condition: service_healthy
      fixture-metadata:
        condition: service_healthy
      fixture-subtitles:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health')",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  phase5-test:
    name: animetvcut-phase5-test
    driver: bridge
