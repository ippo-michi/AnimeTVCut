services:
  animetvcut:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      MEDIAFLOW_URL: http://mediaflow:8888
      MEDIAFLOW_API_PASSWORD: ${MEDIAFLOW_API_PASSWORD:-change-me}
      MEDIAFLOW_REQUEST_TIMEOUT_MS: ${MEDIAFLOW_REQUEST_TIMEOUT_MS:-30000}
      UPSTREAM_STREMIO_MANIFEST_URL: ${UPSTREAM_STREMIO_MANIFEST_URL:-}
      UPSTREAM_STREMIO_REQUEST_TIMEOUT_MS: ${UPSTREAM_STREMIO_REQUEST_TIMEOUT_MS:-30000}
      METADATA_STREMIO_MANIFEST_URL: ${METADATA_STREMIO_MANIFEST_URL:-}
      METADATA_STREMIO_SEARCH_CATALOG_ID: ${METADATA_STREMIO_SEARCH_CATALOG_ID:-}
      METADATA_STREMIO_REQUEST_TIMEOUT_MS: ${METADATA_STREMIO_REQUEST_TIMEOUT_MS:-10000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      SUBTITLES_ENABLED: ${SUBTITLES_ENABLED:-true}
      SUBTITLE_REQUEST_TIMEOUT_MS: ${SUBTITLE_REQUEST_TIMEOUT_MS:-10000}
      SUBTITLE_MAX_SOURCE_BYTES: ${SUBTITLE_MAX_SOURCE_BYTES:-5242880}
      SUBTITLE_ALLOW_PRIVATE_NETWORKS: ${SUBTITLE_ALLOW_PRIVATE_NETWORKS:-false}
      SUBTITLE_ALLOWED_ORIGINS: ${SUBTITLE_ALLOWED_ORIGINS:-}
      SUBTITLE_COMPOSE_FETCH_CONCURRENCY: ${SUBTITLE_COMPOSE_FETCH_CONCURRENCY:-4}
      EXPOSE_TV_CUT: ${EXPOSE_TV_CUT:-true}
      EXPOSE_SEASON_CUT: ${EXPOSE_SEASON_CUT:-true}
      EXPOSE_SERIES_CUT: ${EXPOSE_SERIES_CUT:-true}
      LONG_CUT_FINALIZE_AFTER_DAYS: ${LONG_CUT_FINALIZE_AFTER_DAYS:-14}
      LONG_CUT_ALLOW_UNKNOWN_RELEASE_DATES: ${LONG_CUT_ALLOW_UNKNOWN_RELEASE_DATES:-false}
      SEASON_CUT_MAX_EPISODES: ${SEASON_CUT_MAX_EPISODES:-30}
      SERIES_CUT_MAX_EPISODES: ${SERIES_CUT_MAX_EPISODES:-60}
      SEASON_CUT_MAX_ESTIMATED_SECONDS: ${SEASON_CUT_MAX_ESTIMATED_SECONDS:-43200}
      SERIES_CUT_MAX_ESTIMATED_SECONDS: ${SERIES_CUT_MAX_ESTIMATED_SECONDS:-86400}
      SERIES_CUT_INCLUDE_SEASON_ZERO: ${SERIES_CUT_INCLUDE_SEASON_ZERO:-false}
      LONG_CUT_MAX_MEDIA_SEGMENTS: ${LONG_CUT_MAX_MEDIA_SEGMENTS:-20000}
      LONG_CUT_MAX_MANIFEST_BYTES: ${LONG_CUT_MAX_MANIFEST_BYTES:-5242880}
      LONG_CUT_SEASON_PREPARE_CONCURRENCY: ${LONG_CUT_SEASON_PREPARE_CONCURRENCY:-2}
      CUT_SESSION_IDLE_TTL_SECONDS: ${CUT_SESSION_IDLE_TTL_SECONDS:-21600}
      CUT_SESSION_MAX_LIFETIME_SECONDS: ${CUT_SESSION_MAX_LIFETIME_SECONDS:-172800}
      TV_CUT_TARGET_SECONDS: ${TV_CUT_TARGET_SECONDS:-3600}
      TV_CUT_MIN_SECONDS: ${TV_CUT_MIN_SECONDS:-3000}
      TV_CUT_MAX_SECONDS: ${TV_CUT_MAX_SECONDS:-4500}
      TV_CUT_MAX_EPISODES: ${TV_CUT_MAX_EPISODES:-4}
      TV_CUT_ASSUMED_OPENING_SECONDS: ${TV_CUT_ASSUMED_OPENING_SECONDS:-90}
      TV_CUT_ASSUMED_ENDING_SECONDS: ${TV_CUT_ASSUMED_ENDING_SECONDS:-90}
      TV_CUT_TRAILING_GRACE_DAYS: ${TV_CUT_TRAILING_GRACE_DAYS:-14}
      TV_CUT_FALLBACK_RUNTIME_SECONDS: ${TV_CUT_FALLBACK_RUNTIME_SECONDS:-1440}
      INTRODB_ENABLED: ${INTRODB_ENABLED:-true}
      INTRODB_BASE_URL: ${INTRODB_BASE_URL:-https://api.theintrodb.org/v3}
      INTRODB_REQUEST_TIMEOUT_MS: ${INTRODB_REQUEST_TIMEOUT_MS:-10000}
      INTRODB_MIN_CONFIDENCE: ${INTRODB_MIN_CONFIDENCE:-}
      ANISKIP_ENABLED: ${ANISKIP_ENABLED:-true}
      ANISKIP_BASE_URL: ${ANISKIP_BASE_URL:-https://api.aniskip.com/v2}
      ANISKIP_REQUEST_TIMEOUT_MS: ${ANISKIP_REQUEST_TIMEOUT_MS:-10000}
    ports:
      - "${ANIMETVCUT_PORT:-3000}:3000"
    depends_on:
      mediaflow:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  mediaflow:
    image: animetvcut-mediaflow:2.4.9-atc1
    build:
      context: .
      dockerfile: docker/mediaflow/Dockerfile
    restart: unless-stopped
    environment:
      API_PASSWORD: ${MEDIAFLOW_API_PASSWORD:-change-me}
      ENABLE_TRANSCODE: "true"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
